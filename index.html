<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图文代码剪贴笔记</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <!-- TipTap 核心 -->
  <script type="module">
    import { Editor } from 'https://esm.sh/@tiptap/core@3';
    import StarterKit from 'https://esm.sh/@tiptap/starter-kit@3';
    import Image from 'https://esm.sh/@tiptap/extension-image@3';
    import CodeBlockLowlight from 'https://esm.sh/@tiptap/extension-code-block-lowlight@3';
    import { createLowlight, common } from 'https://esm.sh/lowlight';

    // lowlight v3 API：createLowlight(common) 已注册常用语言
    const lowlight = createLowlight(common);

    // IndexedDB 简易封装
    const DB_NAME = "NoteDB";
    const STORE_NAME = "content";
    let db;
    async function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => {
          db = e.target.result;
          db.createObjectStore(STORE_NAME, { keyPath: "id" });
        };
        req.onsuccess = e => { db = e.target.result; resolve(); };
        req.onerror = reject;
      });
    }
    async function saveContent(html) {
      return new Promise(resolve => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.put({ id: "main", html, updated: Date.now() });
        tx.oncomplete = () => resolve();
      });
    }
    async function loadContent() {
      return new Promise(resolve => {
        const tx = db.transaction(STORE_NAME);
        const store = tx.objectStore(STORE_NAME);
        const req = store.get("main");
        req.onsuccess = () => resolve(req.result?.html || "");
      });
    }

    // 防抖函数
    function debounce(fn, delay = 500) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }

    await initDB();
    const $editor = document.querySelector("#editor");
    const $status = document.querySelector("#status");

    const editor = new Editor({
      element: $editor,
      extensions: [
        StarterKit.configure({ codeBlock: false }),
        // TipTap v3 默认拒绝解析 data: URI 图片（parseHTML 排除 src^="data:"），必须开启 allowBase64 才能还原粘贴的本地图片
        Image.configure({ allowBase64: true }),
        CodeBlockLowlight.configure({ lowlight }),
      ],
      content: await loadContent(),
      editorProps: {
        attributes: { class: "min-h-[70vh] p-4 outline-none prose max-w-none dark:prose-invert" }
      }
    });

    // 自动保存
    const autoSave = debounce(async () => {
      $status.textContent = "保存中...";
      await saveContent(editor.getHTML());
      $status.textContent = "✅ 已自动保存";
      setTimeout(()=>$status.textContent="", 2000);
    });
    editor.on("update", () => autoSave());

    // 粘贴图片支持（TipTap v3 的 paste 事件回调参数是 { event }，需解构取原生事件）
    editor.on("paste", ({ event }) => {
      if (!event || !event.clipboardData) return;
      const items = event.clipboardData.items;
      for(const item of items) {
        if(item.type.startsWith("image/")){
          event.preventDefault();
          const file = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (e) => editor.chain().focus().setImage({ src: e.target.result }).run();
          reader.readAsDataURL(file);
        }
      }
    })

    // 绑定按钮事件
    document.querySelector("#btnCode").onclick = () => {
      editor.chain().focus().toggleCodeBlock().run();
    }
    document.querySelector("#btnClear").onclick = () => {
      if(confirm("确定清空全部内容？无法撤销！")){
        editor.commands.setContent("");
        saveContent("");
      }
    }
    document.querySelector("#btnExportMd").onclick = () => {
      downloadFile("note.md", htmlToMarkdown(editor.getHTML()));
    }
    document.querySelector("#btnExportHtml").onclick = () => {
      downloadFile("note.html", editor.getHTML());
    }
    // 轻量 HTML → Markdown 转换（@tiptap/extension-markdown 包不存在，本地实现）
    function htmlToMarkdown(html) {
      const root = new DOMParser().parseFromString(html, "text/html").body;
      function children(n) {
        return Array.from(n.childNodes).map(nodeToMd).join("");
      }
      function liText(li) {
        const nested = Array.from(li.children).filter(c => ["UL","OL"].includes(c.tagName));
        const text = Array.from(li.childNodes)
          .filter(n => !(n.nodeType === 1 && ["UL","OL"].includes(n.tagName)))
          .map(nodeToMd).join("").trim();
        let out = text;
        for (const nl of nested) {
          out += "\n" + nodeToMd(nl).trimEnd().split("\n").map(l => "  " + l).join("\n");
        }
        return out;
      }
      function nodeToMd(n) {
        if (n.nodeType === Node.TEXT_NODE) return n.textContent;
        if (n.nodeType !== Node.ELEMENT_NODE) return "";
        const kids = children(n);
        switch (n.tagName) {
          case "H1": return "# " + kids.trim() + "\n\n";
          case "H2": return "## " + kids.trim() + "\n\n";
          case "H3": return "### " + kids.trim() + "\n\n";
          case "H4": return "#### " + kids.trim() + "\n\n";
          case "H5": return "##### " + kids.trim() + "\n\n";
          case "H6": return "###### " + kids.trim() + "\n\n";
          case "P": return kids + "\n\n";
          case "BR": return "\n";
          case "STRONG": case "B": return "**" + kids + "**";
          case "EM": case "I": return "*" + kids + "*";
          case "S": case "DEL": return "~~" + kids + "~~";
          case "CODE": return n.closest("pre") ? kids : "`" + kids + "`";
          case "PRE": {
            const code = n.querySelector("code");
            const lang = code ? ((code.className.match(/language-([\w-]+)/) || [])[1] || "") : "";
            return "```" + lang + "\n" + (code ? code.textContent : n.textContent).replace(/\n$/, "") + "\n```\n\n";
          }
          case "UL": return Array.from(n.children).filter(c => c.tagName === "LI").map(c => "- " + liText(c)).join("\n") + "\n\n";
          case "OL": return Array.from(n.children).filter(c => c.tagName === "LI").map((c, i) => (i + 1) + ". " + liText(c)).join("\n") + "\n\n";
          case "BLOCKQUOTE": return kids.trim().split("\n").map(l => "> " + l).join("\n") + "\n\n";
          case "HR": return "---\n\n";
          case "A": return "[" + kids + "](" + (n.getAttribute("href") || "") + ")";
          case "IMG": return "![" + (n.getAttribute("alt") || "") + "](" + (n.getAttribute("src") || "") + ")";
          default: return kids;
        }
      }
      return children(root).replace(/\n{3,}/g, "\n\n").trim() + "\n";
    }
    function downloadFile(name, text){
      const blob = new Blob([text], {type:"text/plain"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.click();
      URL.revokeObjectURL(url);
    }
    window.editorIns = editor;
  </script>
  <style>
    .tiptap img { max-width: 100%; }
    pre { background:#111; color:#e5e7eb; padding:1rem; border-radius:8px; overflow-x:auto }
    code { font-family:Consolas,Monaco,monospace; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 dark:text-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto py-6 px-3">
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <h1 class="text-xl font-bold">图文代码笔记</h1>
      <div class="flex gap-2 items-center">
        <span id="status" class="text-sm text-gray-500 w-24"></span>
        <button id="btnCode" class="px-3 py-1 bg-blue-500 text-white rounded text-sm"><i class="fa fa-code"></i> 代码块</button>
        <button id="btnExportMd" class="px-3 py-1 bg-green-500 text-white rounded text-sm">导出MD</button>
        <button id="btnExportHtml" class="px-3 py-1 bg-orange-500 text-white rounded text-sm">导出HTML</button>
        <button id="btnClear" class="px-3 py-1 bg-red-500 text-white rounded text-sm">清空</button>
      </div>
    </div>
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg">
      <div id="editor"></div>
    </div>
    <div class="mt-3 text-sm text-gray-500">
      ✨ 直接 Ctrl+V 粘贴文字、截图、代码；粘贴图片自动嵌入；内容保存在浏览器本地，不上传服务器
    </div>
  </div>
</body>
</html>
